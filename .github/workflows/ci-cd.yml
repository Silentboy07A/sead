name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linter dependencies
        run: |
          npm install --save-dev eslint@8 eslint-config-airbnb-base eslint-plugin-import
          npm install --save-dev stylelint stylelint-config-standard
          npm install --save-dev html-validate

      - name: Lint JavaScript (ESLint)
        run: npx eslint "**/*.js" --ignore-pattern node_modules/

      - name: Lint CSS (Stylelint)
        run: npx stylelint "**/*.css" --ignore-pattern node_modules/

      - name: Validate HTML
        run: npx html-validate index.html

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: lint-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
